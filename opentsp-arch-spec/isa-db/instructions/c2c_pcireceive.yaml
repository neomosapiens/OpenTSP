operation: 'Writes the oldest vector the host''s DMA engine has pushed (the ingress FIFO of this chip''s own host
  interface, host.cycles_per_vector cycles per vector, host.ingress_depth deep; a vector that finds it full waits
  in the DMA engine, nothing is dropped) to stream, which must be one of S24..S31 on either row (the upper eight
  streams, an implementation choice); a MEM Write commits it to SRAM (the two steps, the instruction and the Write,
  are the model''s choice). None arrived: OTS-E-TIM-001. Implementation choice: the instruction, the encoding, the
  queues, the restriction to S24..S31. The published TSP sources: ISCA20 sec. II-6 (the PCIe host interface in the
  C2C module, a lightweight DMA engine that emplaces a model onto the TSP memory).'
