# Instruction catalogue entry. Sail (model/) is normative; test/isa_db/check_isa_db.py
# checks this file against the model's encdec and assembly mappings.
$schema: opentsp.isa-db.instruction
spec_version: '0.1'
name: Transmit
mnemonic: transmit
long_name: Chip-to-chip notification
slice: C2C
units:
- C2C_W_TX
- C2C_E_TX
timing: C2C
encoding:
  width: 32
  match: 0101000011------000000----------
  variables:
  - name: chip_id
    location: 21-16
    kind: chip_id
    hi_location: 2-0
  - name: link
    location: 9-6
    kind: link_id
    hi_location: 5-3
assembly: transmit {chip_id}, {link}
operation: 'Sends the notification vector (lane 0 = 1, other lanes 0) to chip_id over link `link`. link >= c2c.links
  or chip_id not the link''s peer: OTS-E-OPR-001; a link that accepted a vector fewer than c2c.cycles_per_vector
  cycles before is busy: OTS-E-LNK-001, nothing is sent; a Transmit released into the cycles of a csr or ctrl packet
  in flight on the link is OTS-E-LNK-003, nothing is sent. ISCA22 sec. 3.2.'
definedBy: ref
