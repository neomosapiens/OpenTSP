# Instruction catalogue entry. Sail (model/) is normative; test/isa_db/check_isa_db.py
# checks this file against the model's encdec and assembly mappings.
$schema: opentsp.isa-db.instruction
spec_version: '0.1'
name: Write
mnemonic: write
long_name: SRAM write
slice: MEM
units:
- MEM_W
- MEM_E
timing: MEM
encoding:
  width: 64
  match: 0001000001-00000----------------------00000000000000000000000000
  variables:
  - name: addr
    location: 47-32
    kind: sram_addr
    max_expr: sram_words-1
  - name: src
    location: 31-26
    kind: stream
  - name: thread
    location: '53'
    kind: imm1
assembly: write {addr}, {src}, {thread}
operation: Writes stream src to word addr (plus the AGT offsets); only the active tiles of liquid thread `thread`
  (within SetVL) change. Loopable. ISCA20 Table I.
definedBy: ref
