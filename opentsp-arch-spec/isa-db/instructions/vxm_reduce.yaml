operation: 'Per superlane g: lane 16g = add/max/min over lanes 16g..16g+15, folded in ascending lane order (acc
  = lane 16g; acc = op(acc, lane 16g+j) for j = 1..15), each step rounded to nearest even in the element type for
  floats, wrapping for integers (opentsp decision: no source gives the order); other lanes zero; types: signed integer,
  unsigned integer, float, fp8 or bf16 (extension) (i8, f16, i32, f32, u8, i16, u16, u32, e4m3, e5m2, bf16). A source
  written `x.chain` (chain bit set) is the VXM result committed at the VXM station in the cycle before the read
  (ALU chaining, ISCA20 sec. III-C); otherwise the stream value that flows to the station.'
