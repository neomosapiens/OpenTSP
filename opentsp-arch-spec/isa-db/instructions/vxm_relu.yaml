$schema: opentsp.isa-db.instruction
spec_version: '0.1'
name: ReLU
mnemonic: relu
long_name: Vector ReLU
slice: VXM
units:
- VXM
timing: VXM
encoding:
  width: 64
  match: 0010010100--------------0000000000000000---00--00000000000000000
  variables:
  - name: type
    location: 53-52
    kind: eltype_code
    hi_location: 23-22
    top_location: '17'
    codes:
    - 0
    - 2
    - 5
    - 1
    - 3
    - 11
    - 12
    - 16
    extension_codes:
      bf16:
      - 16
  - name: dst
    location: 51-46
    kind: stream
  - name: lhs
    location: 45-40
    kind: stream
  - name: sg4
    location: '18'
    kind: group4
  - name: lhs_chain
    location: '21'
    kind: chain
assembly: relu.{type}{sg4} {dst}, {lhs}{lhs_chain}
operation: 'Per lane: dst = relu(lhs); types: signed integer, float, fp8 or bf16 (extension) (i8, i32, i16, f16,
  f32, e4m3, e5m2, bf16). Group bit (`.sg4` after the type, bit 18): every operand is the 4-stream group at its
  stream (SG4-aligned, else OTS-E-OPR-002) and the ALU performs 4 / width independent operations per lane, one per
  byte (8-bit types) or halfword (16-bit types) of the group (ISCA20 sec. III-C: 32-bit operands on SG4; ''four
  INT8 operations per cycle'' per ALU); for 32-bit types it is the plain operation. The non-group forms of the same
  operations are the specification''s own. A source written `x.chain` (chain bit set) is the VXM result committed
  at the VXM station in the cycle before the read (ALU chaining, ISCA20 sec. III-C); otherwise the stream value
  that flows to the station.'
