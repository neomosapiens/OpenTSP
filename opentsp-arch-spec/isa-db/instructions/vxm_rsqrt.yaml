  width: 64
  match: 0010010111--------------0000000000000000---00--00000000000000000
  variables:
  - name: type
    location: 53-52
    kind: eltype_code
    hi_location: 23-22
    top_location: '17'
    codes:
    - 0
    - 1
    - 3
  - name: dst
    location: 51-46
