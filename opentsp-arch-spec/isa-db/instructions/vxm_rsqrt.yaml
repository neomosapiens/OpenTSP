assembly: rsqrt.{type}{sg4} {dst}, {lhs}{lhs_chain}
operation: 'Per lane: dst = rsqrt(lhs), correctly rounded; types: signed i8 or float (i8, f16, f32). The ISA has
  no divide: 1/x is formed with RSqrt as rsqrt(x * x) (chained; 1/|x|, within 1 ulp for x in [2^-63, 2^64)) or as
  rsqrt(x) * rsqrt(x) (1/x for x > 0 over the normal range, within 2 ulp); the domains, errors and edge values are
  measured in docs/kernel-cookbook.md section 2. Group bit (`.sg4` after the type, bit 18): every operand is the
  4-stream group at its stream (SG4-aligned, else OTS-E-OPR-002) and the ALU performs 4 / width independent operations
  per lane, one per byte (8-bit types) or halfword (16-bit types) of the group (ISCA20 sec. III-C: 32-bit operands
  on SG4; ''four INT8 operations per cycle'' per ALU); for 32-bit types it is the plain operation. The non-group
  forms of the same operations are the specification''s own. A source written `x.chain` (chain bit set) is the VXM
  result committed at the VXM station in the cycle before the read (ALU chaining, ISCA20 sec. III-C); otherwise
  the stream value that flows to the station.'
