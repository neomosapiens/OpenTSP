timing_bounds:
  weight_install:
    source: ISCA20 sec. II (memory), sec. III (matrix unit) and sec. IV (matrix operations)
    quote: the MEM slices can read 409,600 weights from memory and install them into the four (4) 320x320 MXM arrays in
      less than 40 cycles including SRAM and on-chip network transit delay
    convention: not defined by the source. It may count from the first Read to the first usable ABC, from the first to the
      last arrival of weights, or the install stages only. The model counts from the first Read of the schedule (cycle 0)
      to the dispatch cycle of the first ABC that may use the installed weights.
    value: under 40 cycles
    model_value: 41 cycles on ref (first ABC at cycle 41). Derivation in profile keys, with 32 streams per row, two rows
      and four planes installed by 2 x 32 x 320 bytes per cycle, 409,600 / 20,480 = 20 install cycles; the farthest of the
      32 nearest MEM slices per hemisphere (quad 3, 16 gaps from the matrix input station) reaches the plane after mem.d_func
      5 + 16 = 21 cycles; the last install (cycle 40) is followed by timing.mxm_iw.d_func 1. In profile keys the first ABC
      is (issues - 1) + mxm_iw.d_func + mem.d_func + transit = 19 + 1 + 5 + 16 = 41 (on ref with mxm_iw.d_func 3 it is 43,
      measured). Counted from first to last arrival the same schedule takes 20 cycles (arrivals at 21 to 40).
    status: exceeded by 2 (recorded)
    reproduce: 'tools/tsp_as.py asm and tsp_sim on the 80-install schedule (T = 21, ABC at A = 41): no diagnostic; the schedule
      with A = 40 does not assemble because the activation Read shares a MEM queue slot with a weight Read (OTS-E-QUE-001),
      which shows the generator needs a second slice and does not prove 40 impossible'
    note: 41 exceeds 'less than 40' (at most 39) by 2 cycles. A profile with mem.d_func 3 meets the bound (the first ABC
      at 39); test/directed/published_bounds.py runs that variant of the profile on every model_test.sh run and measures
      39. The shipped latencies are implementation choices (timing_rows), so the profile is not changed for a loosely worded
      figure.
  barrier:
    source: ISCA20 sec. III-A (instruction control unit)
    quote: A chip-wide barrier synchronization can be accomplished in 35 clock cycles, from the time the Notify is issued
      to the time the Sync is satisfied and retired
    convention: from the Notify's issue to the retirement of the Sync, as the paper states it
    value: 35 cycles
    model_value: 35 cycles (barrier.release_latency, carried by the key and not by a d_func)
    status: met
  resnet50_latency:
    source: ISCA20 sec. I (contributions) and sec. V (discussion)
    quote: 'sec. I: ResNet50 image classification model executing a sample image query in less than 49 us, yielding 20.4K
      IPS of batch-size1 inference throughput. sec. V: performing an inference query of the ResNet model in < 43 us, yielding
      a throughput of 20.4K images per second ... the TSP has an inference latency of only 49 us for a single image sample'
    convention: end-to-end latency of one image on the first silicon, including the host and any I/O the paper counts. The
      source states 49 us (sec. I and sec. V) and, for the query itself, under 43 us (sec. V); it does not say which parts
      of the 6 us difference it counts.
    value: under 49 us per image (under 43 us for the query, sec. V)
    model_value: none (the repository holds no ResNet-50 workload)
    status: not reproduced (no ResNet-50 workload exists; a cycle count of another network says nothing about it)
encoding:
  all:
    basis: decision
    cite: 'The inspected primary papers and public slides do not specify a complete binary encoding. Every opentsp opcode
      and field placement is an independent interface choice: 32-bit CU/MXM/C2C and 64-bit MEM/VXM/SXM instructions, with
      explicit operand ranges and reserved bits. These widths do not assert commercial binary compatibility.'
host:
  csr_space:
    basis: implementation-choice
    cite: 'ISCA20 section II-6 and HC34 p.45 establish host access and packet categories, not this register/protocol interface.
      Implementation rationale: 4096 registers of 64 bits, reads of an unmapped address give 0 and writes are ignored; HostWait
      observes the doorbell, so host CSR actions can change execution timing; other CSR effects follow the platform contract'
    why: 4096 registers of 64 bits, reads of an unmapped address give 0 and writes are ignored; HostWait observes the doorbell,
      so host CSR actions can change execution timing; other CSR effects follow the platform contract
  csr_map:
    basis: implementation-choice
    cite: 'none: no address is published'
    why: 0x000 CHIP_ID, 0x030 IRQ_CAUSE (W1C), 0x031 IRQ_MASK (reset 0xFFFF), 0x032 IRQ_COUNT, 0x300 + i DOORBELL[i]; the
      error registers of the RAS group take 0x010.. and are not part of this change
  msix_numbering:
    basis: implementation-choice
    cite: 'the published sources: MSI-X interrupts to the host, in the event of a multi-bit memory error'
    why: vector 0 is reserved for errors, vectors 1..15 are raised by HostNotify
  start_cycle:
    basis: implementation-choice
    cite: 'ISCA20 sec. II-6: the host interface provides an entry point for bootstrapping the model execution'
    why: the program load before cycle 0 is the DMA emplacement; `H start c` moves the entry point so that queues start
      dispatching at cycle c
  instruction_injection:
    basis: implementation-choice
    cite: 'ISCA20 section II-6 and HC34 p.45 establish host access and packet categories, not this register/protocol interface.
      Implementation rationale: the interface is ours: `H inject` appends text units to a queue''s IQ at a cycle, with the
      IQ overflow rule'
    why: 'the interface is ours: `H inject` appends text units to a queue''s IQ at a cycle, with the IQ overflow rule'
  irq_mask_reset:
    basis: implementation-choice
    cite: 'none: the reset value of an interrupt mask is not published'
    why: 'IRQ_MASK resets to 0xFFFF, every vector masked in the sense of the register (bit set = delivered): the least restrictive
      reset, so that a HostNotify of a program reaches the host with no setup by the host, the host can still mask by writing
      the register'
  doorbell_one_ring:
    basis: implementation-choice
    cite: 'the published sources: the host interface and the host''s DMA engine; no doorbell semantics are published'
    why: a doorbell is a one-bit register; a ring is kept until a HostWait takes it, and one ring releases one HostWait
      (a second ring while none waits is not counted again); the least state that lets the host and the program meet in
      either order without a lost or a doubled wake-up
  remote_reply:
    basis: implementation-choice
    cite: 'ISCA20 section II-6 and HC34 p.45 establish host access and packet categories, not this register/protocol interface.
      Implementation rationale: a remote read (`P csr <cycle> <link> r <addr>`) is answered by a csr packet that returns
      on the link the request came in and is printed as `T csr <cycle> <chip> <addr> <value>` in the section of the chip
      that asked when it arrives; a remote write has no reply; the access takes effect on the chip at the far end of the
      link at the packet''s arrival cycle, before that cycle''s tick'
    why: a remote read (`P csr <cycle> <link> r <addr>`) is answered by a csr packet that returns on the link the request
      came in and is printed as `T csr <cycle> <chip> <addr> <value>` in the section of the chip that asked when it arrives;
      a remote write has no reply; the access takes effect on the chip at the far end of the link at the packet's arrival
      cycle, before that cycle's tick
  packet_types:
    basis: implementation-choice
    cite: 'HC34 p.45: the header flit of a link packet carries "Type (data, CSR, Sync, Ctrl)"'
    why: 'every transfer on a link has one of the four types: Send is data, Transmit is sync, a remote CSR access is csr,
      the control unit''s own messages are ctrl; data and sync enter the receive FIFO, csr and ctrl are consumed by the
      receiving chip''s control unit when they arrive, so no Receive sees them and OTS-E-LNK-002 counts data and sync only
      (the control unit is a different consumer than the receive queues, which is why the published design gives it its
      own types); the header''s bit encoding and the content of ctrl are not published and not modelled'
  packet_flits:
    basis: implementation-choice
    cite: 'HC34 p.45: a packet is a 320-byte vector in flits of 8 bytes with a header flit; the fields of csr and ctrl packets
      are not published'
    why: a csr packet is three flits (header; operation, chip, address, tag; value) and a ctrl packet two (header; payload);
      a packet occupies a link for ceil(c2c.cycles_per_vector * flits / flits of a vector) cycles (a vector, 1 + vlanes
      / 8 flits, for exactly c2c.cycles_per_vector), the same bandwidth per flit for every type and the shortest occupancy
      that this bandwidth allows
  link_share:
    basis: implementation-choice
    cite: 'ISCA22 sec. 2.3: a link never applies back pressure and software schedules both ends; the sources are silent
      about how other traffic shares a link with the scheduled vectors'
    why: 'a link is one serial channel (HC34 p.45), so its packets leave in the order they are made and do not overlap;
      the control unit decides from what it knows at the cycle, never from what comes after it (a rule that looks ahead
      for a gap would make a departure depend on a packet that arrives after it left, RV2-B-13): a csr or ctrl packet leaves
      at the first cycle at which no earlier packet of the chip still occupies the link (typed packets share it) and no
      vector the link accepted before is still on it. A Send or Transmit that the program releases into the cycles of a
      packet in flight is a program error (OTS-E-LNK-003, no effect): the program is compiled for both ends of a link and
      a collision is a compile-time error, as OTS-E-LNK-001 is for two vectors. The departure cycle is a function of the
      packet''s ready cycle and the chip''s own schedule only, so it is the same for every way of running the chips (tests:
      --window)'
  link_hop:
    basis: implementation-choice
    cite: 'ISCA20 section II-6 and HC34 p.45 establish host access and packet categories, not this register/protocol interface.
      Implementation rationale: no routing is modelled: every chip has its own host interface, so a host never reaches another
      chip through the links; a csr packet is one hop (the control unit of a chip to the chip at the far end of one of its
      links), which is all the control unit needs to read or write a neighbour''s register; the multi-hop walk over a spanning
      tree of the earlier version had no source and is removed'
    why: 'no routing is modelled: every chip has its own host interface, so a host never reaches another chip through the
      links; a csr packet is one hop (the control unit of a chip to the chip at the far end of one of its links), which
      is all the control unit needs to read or write a neighbour''s register; the multi-hop walk over a spanning tree of
      the earlier version had no source and is removed'
  ctrl_packet:
    basis: implementation-choice
    cite: HC34 p.45 (Ctrl packet type); no content or sender is published
    why: the model has no sender of ctrl packets (the clock alignment messages would be the first); the input line `P ctrl
      <cycle> <link>` makes the control unit of a chip send one, so that the type, its link occupancy and its consumption
      by the control unit are exercised; the packet has no other effect
ecc:
  scheme:
    basis: paper
    cite: 'ISCA20 sec. II-D: "The error correcting code (ECC) used to protect vectors in SRAM memory is also used as they
      flow on the stream registers on-chip"; check bits are generated "only at the producer" and stored "alongside the 128-bit
      memory word as 9-bit ECC, 137-bits in total"; "The ECC scheme implements SECDED"; a consuming functional slice "will
      check the ECC bits to ensure data integrity before operating on it"'
  coverage:
    basis: slides
    cite: 'HC34 p.56 (SECDED ECC on all memory, stream registers and datapaths: corrects single-bit errors and detects multiple-bit
      errors), p.57 (ECC Everywhere; stream registers of 32 x 138 bits per direction), p.59 (the 45 stream-register stations
      per superlane are SECDED protected); ISCA22 sec. 4.5 (every single-bit error is corrected in situ, every multi-bit
      error is detected)'
  code_construction:
    basis: implementation-choice
    cite: the published TSP sources give 9 check bits for 128 data bits and the SECDED property; no parity-check matrix
    why: 'the extended Hamming code (137, 128): data bit j at the j-th codeword position >= 3 that is not a power of two,
      c[0..7] the Hamming checks, c[8] the overall parity; any (137, 128) SECDED code has the published behaviour, and this
      one is the standard construction with a decoder that names the flipped bit'
  word_layout:
    basis: implementation-choice
    cite: 'HC34 p.57: the stream register is 138 bits wide, of which 128 are data and 9 are the 9-bit ECC (ISCA20 sec. II-D)'
    why: the 138th bit is the spare bit; its position (bit 137 of the word, after the check bits) and the bit numbering
      of the injection lines (0..127 data, 128..136 c[0..8], 137 spare) are ours; the spare bit carries no code and a flip
      of it is no ECC event
  protection_unit:
    basis: implementation-choice
    cite: 'ISCA20 sec. II-D: the 128-bit memory word; the lanes of one superlane are 16 bytes'
    why: 'one superlane word (16 lanes = 128 bits) is the unit that carries a code: a 320-lane vector holds 20 independent
      codes, so a single flip in each superlane is corrected independently and a poison marks the superlane'
  overlay_representation:
    basis: implementation-choice
    cite: 'none: the representation is a modelling device'
    why: the model stores the data bits as stored and a 10-bit overlay per superlane (the stored check bits XOR the check
      bits of the stored data, plus the spare bit); an overlay of zero is a valid codeword, so a program with no fault has
      no ECC state and the fault-free path costs one comparison; test_ecc.sail proves the equivalence with an explicit encoder
      and decoder
  mem_read_write_unchecked:
    basis: implementation-choice
    cite: 'ISCA20 sec. II-D: the check is made by a slice that operates on a stream'
    why: 'a MEM Read puts the stored word and its overlay on the stream and a MEM Write stores the stream''s bits and overlay:
      neither operates on the value, so the code travels with the word and the first consumer that operates on it checks;
      storing the word through an unchecked Write keeps a multi-bit error visible to later readers instead of hiding it'
  gather_scatter_check:
    basis: implementation-choice
    cite: 'ISCA20 sec. II-D: a slice that operates on data checks it'
    why: 'a Gather reads and a Scatter merges the stored word of its address, one tile per superlane; each checks the superlane
      it uses as a consumer (the map stream and a Scatter''s data stream are checked as ordinary operands: an address with
      a single flip is corrected, and a tile whose map superlane is uncorrectable makes no access, which keeps a wrong address
      from reading or writing another word); a Scatter generates the code of the word it stores'
  no_write_back:
    basis: implementation-choice
    cite: 'ISCA22 sec. 4.5: single-bit errors are corrected in situ (not whether the stored copy is rewritten)'
    why: a correction is made for the reader and the stored copy keeps the flipped bit, so a correction costs no cycle and
      changes no timing; every later reader corrects and reports it again
  uncorrectable_poison:
    basis: implementation-choice
    cite: 'ISCA22 sec. 4.5: multi-bit errors are detected; the published sources give no behaviour after detection'
    why: 'the instruction reports OTS-E-ECC-001 once and its result carries an invalid code (c[0] and c[1] inverted: syndrome
      3, even parity; the spare bit stays clear, it belongs to the error report) in the superlanes that read the bad value,
      so no consumer uses it silently and each reports it again; a unit whose output superlane depends on several inputs
      (SXM Shift and Permute) poisons every output superlane; the other superlanes hold the correct result (the least restrictive
      choice that keeps the error visible)'
  overlay_merge:
    basis: implementation-choice
    cite: 'none: the sources are silent on merged streams'
    why: 'values that are OR-merged (two liquid threads, the SEL and TSP streams of an SXM hemisphere) merge their overlays
      by OR: a side with no fault keeps the other side''s overlay, which never turns a faulted value into a valid one'
  diagnostic:
    basis: implementation-choice
    cite: ISCA20 sec. II-D (soft errors are recorded for an error handler); the published detection of multi-bit errors
      (ISCA22 sec. 4.5)
    why: OTS-E-ECC-001 is the deterministic stand-in for the published error report; its name, its once-per-instruction
      rule and the T ecc trace line (corrected and uncorrectable findings) are ours; the CSR log of the events is
  fault_injection:
    basis: implementation-choice
    cite: 'none: soft errors are not a function of a program'
    why: the harness injects a flip with an F line (a bit of a stored SRAM word or of a value in a stream register at the
      start of a cycle) so that a deterministic model can show the published behaviour; the transient or permanent kind
      is accepted and ignored (the fault model is )
  software_scrub:
    basis: implementation-choice
    cite: 'none: no published source mentions scrubbing; ISCA20 sec. II-D: corrected soft errors are ''an early sign of
      wearout'''
    why: a stored single-bit error stays in the SRAM (a Read does not check and no correction is written back), so a second
      upset of the word makes it uncorrectable; the sequence MEM Read a, VXM max of the stream with itself, MEM Write a
      removes the first error with no new hardware (the VXM checks the operand and generates fresh check bits); test/directed/ras_scrub.py
      runs it. The hardware patrol scrubber is the key scrub.period (microarchitecture.md sec. 15.4)
ras:
  error_register:
    basis: paper
    cite: 'ISCA20 sec. II-D: soft errors "are automatically corrected and recorded in a control and status register (CSR)
      for an error handler to interrogate later"'
  host_interrupt:
    basis: paper
    cite: 'ISCA20 sec. II-6: the host interface "provides a general mechanism for passing interrupts to the host, which
      may be necessary in the event we observe a multi-bit memory error"'
  runtime_replay:
    basis: paper
    cite: 'ISCA22 sec. 4.5: multi-bit errors are detected "so that the runtime software can replay the inference"; HC34
      p.60: one-shot replay on an error lets the runtime check whether the fault is transient or persistent'
  csr_map:
    basis: implementation-choice
    cite: 'none: no register address is published'
    why: 0x010 ERR_STATUS (W1C), 0x011 ERR_SEVERITY, 0x012 SBE_COUNT, 0x013 MBE_COUNT, 0x014 LOG_COUNT, 0x015 LOG_POP, 0x016
      ERR_MASK, 0x020.. the log, 0x0F0/0x0F1 FIRST_ERR, 0x100 + q FETCH_RT[q]; the addresses are the design note's, the
      log is limited to 8 entries so that it does not reach the IRQ registers at 0x030
  err_status_bits:
    basis: implementation-choice
    cite: none
    why: 'one bit per kind of event (corrected and uncorrectable data, corrected and uncorrectable text, matrix, link, spare-bit
      report) plus bit 9 for a dropped log entry: bits 4 and 5 are set by the matrix-unit check events and bits 6 and 7
      by the link FEC events, bit 8 exists for the feature that reports spare-bit use and reads 0 until then; ERR_SEVERITY
      is derived (2 when bit 1, 3, 5 or 7 is set, else 1 when bit 0, 2, 4, 6 or 8 is set), so it falls when the host clears
      ERR_STATUS'
  counters:
    basis: implementation-choice
    cite: 'ISCA20 sec. II-D: corrected soft errors are ''an early sign of wearout''; no counter is published'
    why: SBE_COUNT and MBE_COUNT count corrected and uncorrectable events, saturate at 2^32 - 1 and clear on any write;
      every event is counted, also when the log is full
  log_entry:
    basis: implementation-choice
    cite: none
    why: word 0 = cycle, kind and queue; word 1 = the location (register, SRAM word or text word), the superlane and the
      syndrome position; the control channel is queue 0x090 and a chip-wide event 0xFFF; a stream register is located by
      its row, stream and the reader's gap
  log_overflow:
    basis: implementation-choice
    cite: none
    why: a new event when the log is full is dropped and sets ERR_STATUS bit 9; the counters still count; FIRST_ERR keeps
      the first event since ERR_STATUS was last cleared to zero, also when its log entry was popped or dropped
  fetch_rt_csr:
    basis: implementation-choice
    cite: 'none: the published sources do not give the register'
    why: 'FETCH_RT[q] reads icu.fetch_latency and ignores writes: the profile key stays the authority, a writable register
      would let the host alter timing'
  error_interrupt:
    basis: implementation-choice
    cite: ISCA20 sec. II-6 (interrupts to the host); the register interface and the timing are not published
    why: 'the interrupt is MSI-X vector 0 of the host interface (reserved for the errors): it is delivered in the cycle
      in which an event sets a bit of ERR_STATUS that ERR_MASK enables (0 to 1 changes only; reset mask 0x0AA, the uncorrectable
      bits), and then follows IRQ_CAUSE and IRQ_MASK like any vector; the design note lists the reset value 0x0AA and also
      names the overflow and permission bits, the number wins'
  no_stop:
    basis: implementation-choice
    cite: 'HC34 p.55: no reactive components in the hardware datapaths'
    why: 'the chip does not stop on an uncorrectable error: no mechanism that halts a queue is published; the published
      response is the runtime''s, after the error'
  text_ecc:
    basis: paper
    cite: 'ISCA20 sec. II-D: "Any soft error upsets (SEUs) on operands or instruction text are automatically corrected and
      recorded in a control and status register (CSR) for an error handler to interrogate later"'
  text_ecc_coverage:
    basis: slides
    cite: 'HC34 p.57 (ECC Everywhere): the instruction buffers (x144) and the instruction queues (x144) are protected'
  text_word_frame:
    basis: implementation-choice
    cite: 'ISCA20 sec. II-D: the 128-bit memory word; no framing of instruction text is published'
    why: 'a text word is 16 bytes of text (four 32-bit units: one superlane of an Ifetch or IfetchM payload, or four consecutive
      units of the initial image) and carries the 138-bit code of section 15: the same word the SRAM and the stream registers
      protect, so a fetched payload keeps the check bits it had in the SRAM or on the stream'
  text_check_point:
    basis: implementation-choice
    cite: 'none: the published sources do not say where the instruction queue is checked'
    why: every instruction checks the one or two text words it lies in when its parcel dispatches, before its fields act
      (the decoder sees the corrected text); an instruction that straddles a word boundary checks both words (the pair),
      so an uncorrectable word is OTS-E-ECC-002 for every instruction with a unit in it, the timing NOP included
  text_write_back:
    basis: implementation-choice
    cite: none
    why: 'a corrected text error is written back to the queue (the word is corrected once and its code made valid), unlike
      the data of section 15: an instruction word stays in the queue for several cycles, and counting one fault once per
      reader would count it once per instruction of the word'
  text_error_diagnostic:
    basis: implementation-choice
    cite: 'ISCA22 sec. 4.5: multi-bit errors are detected; no behaviour after detection is published'
    why: 'OTS-E-ECC-002: an instruction in an uncorrectable text word is not executed (its fields cannot be trusted) and
      reports the diagnostic, once per instruction; the width of the instruction is read from the raw first unit, so the
      parcel boundaries stay as they were'
  text_fetch_poison:
    basis: implementation-choice
    cite: none
    why: an Ifetch whose operand read found an uncorrectable superlane fetches a text word with an invalid code for that
      superlane (the poison of section 15), and an IfetchM fetches the stored word with its stored code, so a fault in the
      data that was fetched is found when the text is used
  text_fault_injection:
    basis: implementation-choice
    cite: 'none: soft errors are not a function of a program'
    why: F iq <cycle> <queue> <word> <bit> flips a bit of a text word while it is in the queue; the word is counted from
      0 over the queue's text in production order (the initial image, then the units of each fetched payload); a word that
      is not in the queue at that cycle is an input error
  mxm_events:
    basis: implementation-choice
    cite: 'none: HC34 p.60 says only that the matrix unit is a structure whose computation can be corrupted; no register,
      field or interrupt for it is published'
    why: ', : a corrected lane is a kind 5 log entry (ERR_STATUS bit 4, SBE_COUNT), an uncorrectable ABC a kind 6 entry
      (bit 5, MBE_COUNT); queue the ABC''s, cycle its execute cycle, word 1 = plane << 16 | lane; the check locates no lane
      of an uncorrectable ABC, so its lane field is 0xFFFF, a value no lane has; the interrupt follows ERR_MASK (reset 0x0AA:
      an uncorrectable ABC raises MSI-X vector 0, a corrected lane does not)'
  link_events:
    basis: implementation-choice
    cite: 'ISCA22 sec. 4.5: critical link errors are flagged for the runtime; no register, field or interrupt for them is
      published'
    why: ', : a corrected flit is a kind 7 log entry (ERR_STATUS bit 6, SBE_COUNT), an uncorrectable flit a kind 8 entry
      (bit 7, MBE_COUNT); one flit is one event, as the link counters count it; no queue (0xFFF), cycle the arrival cycle,
      word 1 = link << 16 | flit with the receiving chip''s link; the interrupt follows ERR_MASK (an uncorrectable flit
      raises MSI-X vector 0 at reset, a corrected one does not); LINK_CORR and LINK_UNCORR are unchanged'
  features_register:
    basis: decision
    cite: none
    why: 'the design note''s FEATURES register (one bit per optional feature) is not implemented: with no feature gate every
      feature is part of the base model and there is nothing for it to report'
  replay_policy:
    basis: implementation-choice
    cite: ISCA22 sec. 4.5 (the runtime replays the inference after a detected multi-bit error); HC34 p.60 (one-shot replay
      tells a transient fault from a persistent one); the mechanism is not published
    why: 'the replay is a policy of the harness (tsp_sim --on-irq stop|continue|replay), not chip state: the chip keeps
      no replay register and never stops itself (no_stop); stop ends the run at the end of the cycle of the first error
      interrupt (exit 5), replay runs the same input a second time from reset with the persistent faults only and prints
      T replay start before it and T replay resolved (exit 0) or T replay persistent (exit 5) after it; continue is the
      default and the plain run; stop and replay need one chip'
  fault_marks:
    basis: implementation-choice
    cite: 'HC34 p.60 (transient or persistent): the published slide names the distinction, not an input syntax'
    why: 'an F line takes a last word t (transient, the default: gone in the replay, as a soft error is) or p (persistent:
      comes again in the replay, as a hard fault does); without a replay the mark has no effect'
  spare_report:
    basis: implementation-choice
    cite: 'none: the published TSP sources are not cited for this feature; HC34 p.57 gives the 138-bit stream register,
      ISCA20 sec. II-D the ECC and the error CSR'
    why: 'the spare bit (bit 137) of each superlane of a stream register is the error report: S[0] Gather bounds, S[1] Scatter
      bounds, S[2] bank conflict, S[3] the even parity of S[0..2], the auxiliary information (address and streams) on the
      spare bits of the other streams, priority Gather then Scatter then bank conflict; a fault-free system has every spare
      bit clear, so the poison of an uncorrectable word uses the check bits alone'
  spare_report_where:
    basis: implementation-choice
    cite: none
    why: a report is written in the commit cycle of the instruction at the write gap of its slice on the row of its data
      stream (Gather destination, Scatter source), in the superlane of each bad tile; it is a write of spare bits only,
      kept beside the register words on their diagonal, and a reader that finds a value there sees the report with it unless
      a nearer data write replaced the register; the auxiliary layout is S[4..16] the 13-bit address, S[17..22] the map
      stream (row bit, id), S[23..28] the data stream
  spare_report_consumer:
    basis: implementation-choice
    cite: none
    why: 'no instruction reads a spare bit; every stream operand read whose spare bit is set is logged by its consumer:
      the trace line T ecc <cycle> queue <q> spare <row>:<stream> sl <x> pos <S[0..3]>, a log entry of kind 9 (ERR_STATUS
      bit 8) and no interrupt (ERR_MASK resets with bit 8 clear), so the triangulation (the consumer gives the place on
      the row, the superlane the tile) is observable'
  spare_report_bank:
    basis: implementation-choice
    cite: 'none: the published TSP sources are not cited for the layout; they give the error bit S[2], the priority and
      that a bank conflict stores a write address and a read address'
    why: 'a pair of MEM references that meet in a bank (OTS-E-MEM-001, neither runs) writes in the commit cycle at the write
      gap of its slice, on the row of the R-type reference''s data stream, superlane 0 (a conflict belongs to the slice,
      not to a tile), S[2] and the parity S[3], the 13-bit write address on S[4..16] and the 13-bit read address on S[17..29]
      (the layout is ours; an indirect reference has no address at dispatch: zero; an IfetchM pair has no data stream: no
      report); it has the lowest priority, so a Gather or Scatter report in the same register keeps its auxiliary data and
      S[2] is still noted; the spare plane has 30 streams for it'
  mxm_poison:
    basis: implementation-choice
    cite: ISCA22 sec. 4.5 and HC34 p.56-59 (errors are detected end to end); how a matrix product carries an uncorrectable
      operand is not published
    why: an uncorrectable activation poisons every superlane of the ABC product (a product lane sums over all activation
      lanes); an uncorrectable weight row r poisons product lane r, that is superlane r / 16 (an f16 row is two buffer rows);
      an ACC writes the poison into its result and its accumulator, and an accumulating ACC ORs the accumulator's poison
      in; the poison of an ACC result is inherited, so only the consumer of the result reports OTS-E-ECC-001
  c2c_poison:
    basis: implementation-choice
    cite: ISCA22 sec. 4.5 and HC34 p.56-59 (errors are detected end to end); the link's error code is not published
    why: a Send whose operand has an uncorrectable superlane puts the vector on the link with the mask of those superlanes
      (the invalid code the vector would carry), a Receive writes it poisoned in the same superlanes and reports nothing
      itself; the consumer reports; Transmit and control packets are never poisoned
link_fec:
  scheme:
    basis: paper
    cite: 'ISCA22 sec. 4.5: "we use forward error correction (FEC) on every link to correct simple transmission errors and
      detect uncorrectable burst errors", so the system can "correct transmission errors in situ, and flag any critical
      errors that require the runtime system to ''replay'' the inference"; ISCA22 sec. 4: FEC "to avoid reactive link-layer
      replay"; HC34 p.41: the FEC "corrects most transmission errors deterministically"; HC34 p.56: single-bit errors are
      corrected and multiple-bit errors detected'
  packet_format:
    basis: slides
    cite: 'HC34 p.45: a 320-byte vector in flits of 8 bytes, a header flit, body flits and a tail flit, no hardware flow
      control and no virtual channel information'
  flit_count:
    basis: implementation-choice
    cite: HC34 p.45 has five payload bytes in the header and three in the tail,39 full body flits for320 bytes.
    why: Use vlanes/8 +1 total flits, including header and tail, for profiles whose vector length is a multiple of16.
  flit_superlane_map:
    basis: implementation-choice
    cite: HC34 p.45 explicitly labels bytes0..4,5..12,13..20 and317..319.
    why: Body flit f covers bytes5+8* through12+8*. Data fault masks include every overlapping superlane; header/tail control
      faults conservatively invalidate the whole vector.
  outcome_model:
    basis: implementation-choice
    cite: ISCA22 sec. 4.5 (simple errors corrected, burst errors detected); the FEC code is not published
    why: 'a deterministic model has no transmission errors, so the harness marks a flit of a vector as corrected in flight
      (the vector arrives intact) or detected and not corrected (the vector arrives with the flit''s superlanes poisoned)
      with an F link line; the FEC code and its latency are not modelled, and the FEC adds no cycle (HC34 p.41: deterministic)'
  counters:
    basis: implementation-choice
    cite: ISCA20 sec. II-D (corrections are recorded for an error handler); no address or layout is published
    why: 'two read-only CSR arrays per chip count flits at the arrival cycle of the vector on the receiving chip''s link
      l: LINK_CORR[l] at 0x200 + l and LINK_UNCORR[l] at 0x210 + l, the addresses of the design of the RAS group, cleared
      by reset; the same events are also recorded in the error registers and raise the error interrupt (ras.link_events)'
  uncorrectable_receive:
    basis: implementation-choice
    cite: 'ISCA22 sec. 4.5: critical errors are flagged for the runtime; the published sources give no receiver behaviour'
    why: the Receive that takes the vector reports OTS-E-LNK-004 once, after its own checks, and still writes it with its
      bad superlanes poisoned (the poison of the ECC, sec. 15), so the error is never silently used and the first consumer
      reports OTS-E-ECC-001; writing it keeps the schedule of the program, which a deterministic machine cannot change after
      the fact
  diagnostic_code:
    basis: implementation-choice
    cite: 'none: the code is ours'
    why: OTS-E-LNK-004; the design of this feature named the code OTS-E-LNK-003, which had already given to the packet-in-flight
      rule, so the next free number is used
  fault_injection:
    basis: implementation-choice
    cite: 'none: transmission errors are not a function of a program'
    why: F link <cycle> <link> <flit> corr|uncorr marks a flit of the vector the chip sends on the link in the cycle; a
      line that marks no vector, a flit out of range, an unconnected link and two lines for one flit are input errors; the
      transient or permanent kind is accepted and ignored (the fault model is )
mxm_check:
  scheme:
    basis: implementation-choice
    cite: 'HC34 p.60: NaN and Inf "may arise due to SDC or SEUs in SRAMs or critical hardware structures (ie. matrix unit)";
      no ISCA20, ISCA22 or HC34 page describes a check on a matrix product'
    why: ', completed in the base model with no gate : the omitted-features list names a matrix-unit computation check by
      expected and actual sums, with location and correction; the model''s form is in microarchitecture.md sec. 18'
  sums:
    basis: implementation-choice
    cite: 'none: the check is ours'
    why: Detect every final multirow error. Primary row-major exact products are compared with independently recomputed
      column-major nominal row products from captured operands; zero changed rows is clean, one identifies that exact row,
      two or more is uncorrectable. Faults affect primary sums only; checker/captured operands are trusted. Redundant physical
      compute, protection, area, energy and timing costs require separate circuit implementation and are not measured here.
  correction:
    basis: implementation-choice
    cite: 'none: the check is ours'
    why: 'a corrected lane has the fault-free product (the model''s arithmetic is exact), printed as T ecc <cycle> queue
      <q> mxm corr plane <p> lane <r>; the correction costs no cycle: the check runs inside the ABC''s d_func, by which
      time every superlane''s activation has arrived'
  uncorrectable:
    basis: implementation-choice
    cite: 'none: the code is ours'
    why: OTS-E-ECC-003 at the ABC's execute cycle after its own checks; the ABC has no effect (its result entry is not added),
      so a dependent ACC reports OTS-E-RES-001 and nothing wrong is used silently; re-execution is the runtime's decision
  trigger:
    basis: implementation-choice
    cite: 'none: a deterministic model has no computation errors'
    why: the check runs only for an ABC with an injected fault pending for its plane; without F mxm lines the actual sums
      equal the expected ones and the trace is identical
  fault_injection:
    basis: implementation-choice
    cite: 'none: computation errors are not a function of a program'
    why: F mxm <cycle> <plane> <lane> <bit> flips a bit (0..95) of the exact 96-bit sum of a lane of the ABC executing on
      the plane in the cycle; a plane or lane or bit out of range, an ABC that does not execute (input error after the cycle,
      exit 2) and two lines for one bit are input errors; a lane above the installed rows carries no product, so it has
      no effect; F mxmw (weight flips) is not implemented
abstractions:
  c2c_program_alignment:
    basis: decision
    cite: 'ISCA22 sec. 3.2: the child device is placed in a polling synchronisation loop and "If that vector has not been
      transmitted yet, the loop will continue". The polling loop is modelled by the instruction DeskewRecv (C2C.DeskewRecv:
      an implementation choice, the ISA has no branch) and a program-start skew by the harness input line H start of each
      chip. Every chip still starts with the same HAC phase (the HAC is the cycle count mod c2c.hac_period), the HAC alignment
      protocol is not modelled (microarchitecture.md sec. 10)'
  hac_sac_drift:
    basis: decision
    cite: 'ISCA22 sec. 3.3: RUNTIME_DESKEW delays for the target number of cycles plus or minus the HAC-SAC drift. Modelled
      chips share one clock, so the drift is 0 and RuntimeDeskew t holds max(t, timing.c2c.rtdeskew_floor) cycles, floor
      1'
  liquid_threads:
    basis: decision
    cite: 'The inspected ISCA20, ISCA22 and HC34 material does not specify this complete behavior. Implementation rationale:
      Use two disjoint tile groups of a single IQ; this exposes per-tile concurrency without an unspecified second instruction
      stream.'
  mxm_accumulator_depth:
    basis: decision
    cite: 'The inspected ISCA20, ISCA22 and HC34 material does not specify this complete behavior. Implementation rationale:
      Retain two vector accumulators, matching replace/add scheduling and bounded state; no hidden result stack is introduced.'
  error_reporting:
    basis: decision
    cite: 'The inspected ISCA20, ISCA22 and HC34 material does not specify this complete behavior. Implementation rationale:
      Retain the explicitly documented opentsp behavior in microarchitecture.md as a bounded, deterministic research interface;
      no exact commercial correspondence is asserted.'
  sxm_39_to_3:
    basis: decision
    cite: 'ISCA20 Fig. 4: an arrow from register 39 back to the ACC end (register 3) of the opposite row; HC34 p.31: an
      arrow from register 39 to register 3 on the other row. No instruction, timing or control for the path is published,
      so the specification does not model it and defines no instruction for it (microarchitecture.md sec. 9). Candidate
      reading: the ISCA20 arrowhead ends on the ACC unit, which suggests an ACC stream input (for example accumulating an
      incoming stream); no instruction for it is published, so the decision stands'
  sxm_or_merge:
    basis: figure
    cite: 'HC34 p.31: the SEL and TSP outputs enter an OR box whose output enters register 5 of the other row (PERM and
      DST do not feed it); ISCA20 Fig. 4: the SXM outputs join the row after register 4. A SEL write and a TSP write of
      one hemisphere to one stream in one commit cycle store their bitwise OR, with no OTS-E-SRF-002. Restricting the merge
      to exactly that pair (any other group, three or more writers included, is SRF-002) is an opentsp decision: the sources
      give only the label. topology.md sec. 4; microarchitecture.md sec. 2'
  vxm_lut_configuration:
    basis: decision
    cite: 'The inspected ISCA20, ISCA22 and HC34 material does not specify this complete behavior. Implementation rationale:
      Use deterministic mathematical operations rather than expose an unspecified LUT-update ISA. Numeric accuracy and timing
      feasibility are separate obligations.'
  sxm_switch_control:
    basis: decision
    cite: 'The inspected ISCA20, ISCA22 and HC34 material does not specify this complete behavior. Implementation rationale:
      Use explicitly loaded maps; permutation validates bijectivity while distribution permits fanout. This gives the compiler
      a complete map contract without inventing hidden routing state.'
  sxm_shf_prm_stations:
    basis: decision
    cite: . ISCA20 Fig. 4 draws outputs crossing to the other row only from TSP and SEL; HC34 p.31 draws SEL and TSP into
      the OR and no outgoing arrow from PERM; neither figure draws a shifter. HC34 p.31 does draw PERM's input at 40. The
      published figures therefore do not place the SHF stations or the PRM output. opentsp places SHF at read gap 40 and
      write gap 4 and PRM's output at gap 4, the stations of the other turn-round units, so that every turn-round unit has
      the same timing (topology.md sec. 4)
  fp8_format:
    basis: implementation-choice
    cite: the published sources (ISCA20, ISCA22, HC34, the SHIP paper) name no 8-bit float format and no instruction on
      one; HC34 p.26 says the VXM "supports a superset of all data types"
    why: ', completed in the base model with no feature gate : two formats, e4m3 (type code 11: bias 7, no infinity, only
      0x7F and 0xFF are NaN, maximum 448, overflow and infinity saturate) and e5m2 (type code 12: bias 15, IEEE style, maximum
      57344, overflow gives infinity), because these are the two 8-bit float formats of machine-learning practice and one
      byte per element keeps the stream layout of i8; round to nearest even, subnormals kept, one canonical NaN per format
      (0x7F, 0x7E); legal on Add, Sub, Mul, Max, Min, Cmp, Mask, Select, Neg, Abs, ReLU, Convert and Reduce, illegal on
      the bitwise, sat/mod, transcendental and fixed-conversion forms; matrix products by lw.fp8/iw.fp8/iws.fp8 and abc.e4m3/abc.e5m2
      (entry ABC8, bit 13 selects the format of both operands), the exact sum rounded once to f32, with the capacity and
      rate of i8. An infinite input converted to e4m3 saturates to the largest finite value, as specified in microarchitecture.md
      sec. 5'
  wide_accumulator:
    basis: implementation-choice
    cite: The inspected ISCA20, ISCA22 and HC34 material gives no accumulator wider than 32 bits; a published 2025 article
      on the same chip family describes 100 bits of intermediate accumulation without detail
    why: 'Extension wide_acc: the accumulator type x128 of ACC adds the exact product of an f16, fp8 or bfp8 ABC (the exact
      sum of the exact products of the row, in units of 2^-48) to a 128-bit signed fixed-point lane (replace or accumulate,
      accumulator 0 or 1) with no rounding, and writes the read-out, the lane rounded once to f32 (round to nearest even),
      on the four streams dst..dst+3. NaN and infinities are sticky in the lane (NaN, or +Inf plus -Inf, gives NaN; the
      canonical NaN of f32); a zero lane is -0 only when every term was -0; the lane wraps at 128 bits (not reachable by
      2^38 accumulations of f16 products). An integer ABC has no wide form (OTS-E-OPR-001). The wide accumulators are separate
      from the 32-bit ones. This is the smallest form that removes the rounding of every accumulation step; the width, the
      depth of two and the read-out are not published'
  block_fp8_format:
    basis: implementation-choice
    cite: The inspected ISCA20, ISCA22 and HC34 material names no block or scaled number format; a published 2025 article
      on the same chip family names block floating point without a format
    why: 'Extension block_fp8: the type bfp8 (type code 1 with the extension bit 12 set) is a stream pair, as f16: the e4m3
      elements in the first stream value and the block scales in the second (mxm.rows / 2 rows per plane, the even plane
      of the pair, the f16 initiation interval). A block is the 16 lanes of one superlane, so the scale is per 16 elements
      as the superlane is the unit of the stream; its scale is the low four bits of the byte at the block first lane, a
      signed exponent -8 .. 7 (the upper four bits and the other lanes are not read, so a 4-bit scale is stored in the byte
      of the first lane). The value of a lane is its e4m3 element times 2 to the scale of its block; the products and their
      sum are exact (units of 2^-48) and rounded once to f32, as the f16 and fp8 forms. The range of the scale is chosen
      so that every product sum stays inside the 96-bit exact sums of the matrix check; a scale of eight bits (a power-of-two
      block scale as in published microscaling formats) needs a wider exact sum and is left to a later extension'
  mxm_multiplier_modes:
    basis: implementation-choice
    cite: ISCA20 section III-D describes paired byte planes for FP16. It does not specify a primitive-multiplier count for
      each exact floating product or an FP8 circuit.
    why: The installed weight type and ABC type select the four i8/u8 sign combinations, FP16 or FP8. Paired-plane FP16
      storage and byte-plane FP8 storage constrain this functional model; exponent handling, multiplier decomposition and
      physical implementation costs are not modeled. Other type combinations are OTS-E-RES-001.
  clock_period_synthesis:
    basis: decision
    cite: 'The inspected ISCA20, ISCA22 and HC34 material does not specify this complete behavior. Implementation rationale:
      No programmable clock-period ISA is modeled. One fixed cycle domain keeps scheduling causal; frequency/voltage research
      requires an explicit extension.'
  offchip_memory:
    basis: decision
    cite: 'The inspected ISCA20, ISCA22 and HC34 material does not specify this complete behavior. Implementation rationale:
      No transparent external-memory extension is modeled. Off-chip transfers use the explicit host interface and are not
      given SRAM timing.'
