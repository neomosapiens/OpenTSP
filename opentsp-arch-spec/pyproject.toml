[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "opentsp-reference"
version = "0.1.0"
description = "Exact numerical reference for OpenTSP architecture 0.1"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE-APACHE-2.0"]
requires-python = ">=3.11"
dependencies = ["mpmath"]

[tool.setuptools.packages.find]
where = ["reference"]
